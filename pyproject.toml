[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "oglodon-transformer"
version = "0.4.0"
description = "Oglodon: build, train and behaviour-verify Transformers; `oglodon verify` checks any causal LM (Hugging Face, custom PyTorch) for causality, padding, KV-cache, numerics and gradient bugs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dhruv Puri", email = "dhruvpurigoswami2004@gmail.com" }]
keywords = ["transformer", "pytorch", "llm", "gpt", "education", "rope", "gqa", "kv-cache"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "safetensors>=0.4",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
yaml = ["pyyaml>=6"]
hf = ["transformers>=4.46"]
docs = ["mkdocs>=1.6"]
dev = ["pytest>=8", "transformers>=4.46", "ruff>=0.5", "matplotlib>=3.8", "build>=1.0", "pyyaml>=6", "mypy>=1.8"]

[project.scripts]
oglodon = "oglodon.cli:main"

[project.urls]
Homepage = "https://github.com/Dhruvg0/Oglodon"
Issues = "https://github.com/Dhruvg0/Oglodon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/oglodon"]

[tool.hatch.build.targets.sdist]
include = ["src/oglodon", "tests", "examples", "benchmarks", "configs", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: takes tens of seconds (run with: pytest -m slow)"]
filterwarnings = ["error::UserWarning:oglodon"]
