name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only torch to keep the job fast)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Slow tests (multi-process training)
        run: pytest -m slow
      - name: Validate (CLI smoke test, CPU)
        run: |
          oglodon validate configs/tiny_gqa.yaml --out validation_report.json
      - name: Verify a model that is not Oglodon (CLI smoke test, random-weight Hugging Face GPT-2)
        run: |
          echo '{"model_type":"gpt2","vocab_size":50,"n_embd":32,"n_layer":1,"n_head":4,"n_positions":32}' > gpt2.json
          oglodon verify --hf-config gpt2.json
      - name: Type check
        run: |
          pip install mypy types-PyYAML
          mypy src
      - name: Docs build
        run: |
          pip install mkdocs
          mkdocs build --strict

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
# Publishing to PyPI is intentionally NOT automated. See docs/publishing.md.
