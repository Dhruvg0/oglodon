name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands or a short script. Smaller is better.
      render: shell
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Output of `oglodon info`
      render: json
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: text
